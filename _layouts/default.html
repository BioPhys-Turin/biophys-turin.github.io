<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    {% include head.html %}
</head>
<body>
    <header>
        {% include nav.html %}
    </header>

    <main>
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/scripts/nav-click.js' | relative_url }}"></script>
    {%- for script in page.scripts %}
    <script src="{{ script | relative_url }}"></script>
    {%- endfor %}
</body>
</html>
