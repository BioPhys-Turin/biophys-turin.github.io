name: Rebuild collaboration network

# Regenerate network/network.html whenever the people or paper data change.
on:
  push:
    branches: [main]
    paths:
      - '_data/researchers.json'
      - '_data/researchers_former.json'
      - '_data/papers.json'
      - 'network/network.py'
      - 'network/network.html.template'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-network:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --only-binary :all: --require-hashes -r network/requirements.txt

      - name: Build network
        run: python network/network.py

      - name: Commit updated network
        run: |
          if git diff --quiet network/network.html; then
            echo "Network unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add network/network.html
          git commit -m "Rebuild collaboration network"
          git push
